<!DOCTYPE html>

<style>
:root{--navy:#0b1f4d;--mint:#2ee6a6;--gold:#ffc83d;--lb:#bfe3ff;--red:#ff4d5e;--blue:#3d8bff}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#fff;font-family:system-ui,sans-serif}
.w{max-width:480px;margin:auto;padding:14px 14px 90px}
h1{margin:0;font-size:34px;letter-spacing:2px}h2{margin:8px 0}
.slog{color:var(--gold);font-weight:700;letter-spacing:3px}
.ad{background:linear-gradient(135deg,#143a91,#1b56d6);border-radius:18px;padding:16px;margin:12px 0;font-weight:700}
.ad b{color:var(--gold);font-size:22px;display:block}
.mini{display:grid;gap:8px}.mini div{background:#12306f;border-radius:12px;padding:10px;font-size:14px}.mini b{color:var(--mint)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;font-size:20px;font-weight:800;margin:10px 0;color:#0b1f4d;cursor:pointer}
.mint{background:var(--mint)}.gold{background:var(--gold)}.white{background:#fff}.lb{background:var(--lb)}
.btn:disabled{opacity:.4}
.card{background:#fff;color:#0b1f4d;border-radius:14px;padding:12px;margin:8px 0}
input,select{width:100%;padding:14px;border-radius:12px;border:2px solid #ccd;font-size:18px;margin:6px 0}
.balls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ball{aspect-ratio:1;border-radius:50%;border:3px solid #fff;background:var(--mint);color:#0b1f4d;font-weight:800;font-size:20px}
.ball.on{background:var(--gold);transform:scale(1.1)}
.row{display:flex;gap:8px}.row .btn{padding:14px;font-size:18px}
.chatfab{position:fixed;right:16px;bottom:16px;background:var(--lb);color:var(--navy);border:0;border-radius:30px;padding:14px 18px;font-weight:800;box-shadow:0 4px 12px #0006}
.msg{background:var(--lb);color:var(--navy);border-radius:12px;padding:8px 12px;margin:6px 0}.msg.me{background:var(--mint);margin-left:30px}
.back{background:none;border:0;color:#fff;font-size:16px;padding:4px 0}.err{color:#ff9aa5}
.t{font-size:13px;opacity:.8}
.wide{max-width:760px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--navy);z-index:5}
.tab{border:0;border-radius:20px;padding:9px 14px;font-weight:700;background:#12306f;color:#fff;white-space:nowrap}.tab.on{background:var(--gold);color:var(--navy)}
.tab i{font-style:normal;background:var(--red);color:#fff;border-radius:10px;padding:1px 7px;margin-left:6px;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.stat{background:#fff;color:var(--navy);border-radius:14px;padding:12px;font-size:13px}.stat b{display:block;font-size:24px}
.chip{display:inline-block;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:800}.pending{background:#fff1c2;color:#7a5a00}
.approved,.paid,.won,.active{background:#c9f7e3;color:#0a6b46}.rejected,.lost,.suspended{background:#ffd5da;color:#a1182b}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.sbtn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.lbl{font-size:13px;font-weight:700;margin-top:8px;display:block}
.nb{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--mint);font-weight:800;font-size:13px;margin:2px}
.big{font-size:20px;font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nearmiss{background:#ffe3b3;color:#8a4b00}
</style></head><body><div id="root"></div>

<script type="text/babel">

const CFG={apiKey:"AIzaSyCGS_76v0c2eN8z1tyTrs_eTeKZ_ld06S8",authDomain:"fluent-jax.firebaseapp.com",projectId:"fluent-jax",storageBucket:"fluent-jax.firebasestorage.app",messagingSenderId:"626832526838",appId:"1:626832526838:web:2793b8a74f5ca5ec6a0bd7"};
const ADMIN="ferdew31@gmail.com";
firebase.initializeApp(CFG);
const auth=firebase.auth(),db=firebase.firestore();
const FV=firebase.firestore.FieldValue,TS=FV.serverTimestamp();
const nice=x=>x.code==="permission-denied"?"Not allowed (check balance, duplicate reference, or closed draw)":x.code==="auth/email-already-in-use"?"This phone is already registered":(x.code||"").startsWith("auth/")?"Wrong phone number or PIN":x.message;
const digits=p=>p.replace(/\D/g,"");
async function register(phone,name,pin){const c=await auth.createUserWithEmailAndPassword(digits(phone)+"@o2liv.app",pin+"-o2liv");
  await db.doc("o2users/"+c.user.uid).set({name,phone:digits(phone),balance:0,cashback:0,freeTickets:0,totalDeposits:0,totalWinnings:0,status:"active",createdAt:TS})}
const login=(phone,pin)=>auth.signInWithEmailAndPassword(digits(phone)+"@o2liv.app",pin+"-o2liv");
async function placeEntry(type,numbers,stake,nx){const uid=auth.currentUser.uid,ref=db.collection("gameEntries").doc(),b=db.batch();
  b.set(ref,{uid,type,numbers:[...numbers].sort((a,b)=>a-b),stake,status:"pending",drawAt:nx.at,drawLabel:nx.label,createdAt:TS});
  b.update(db.doc("o2users/"+uid),{balance:FV.increment(-stake),lastEntry:ref.id});await b.commit()}
async function submitFunding(f){const id=f.reference.replace(/[^A-Za-z0-9_-]/g,"").slice(0,60);
  await db.doc("fundingRequests/"+id).set({uid:auth.currentUser.uid,amount:f.amount,senderName:f.senderName,reference:id,note:f.note||"",status:"pending",createdAt:TS})}
async function requestWithdrawal(w){const uid=auth.currentUser.uid,ref=db.collection("withdrawalRequests").doc(),b=db.batch();
  b.set(ref,{uid,amount:w.amount,bankName:w.bankName,accountName:w.accountName,accountNumber:w.accountNumber,status:"pending",createdAt:TS});
  b.update(db.doc("o2users/"+uid),{balance:FV.increment(-w.amount),lastWd:ref.id});await b.commit()}
const naira=n=>"₦"+Number(n||0).toLocaleString();
const STAKES=[[100,"#2ee6a6"],[200,"#3d8bff"],[500,"#ffc83d"],[1000,"#ff4d5e"]];

function usePay(){const[p,setP]=useState({});useEffect(()=>db.doc("appSettings/payouts").onSnapshot(d=>setP(d.data()||{}),()=>{}),[]);return p}
function Ad(){const p=usePay(),L=x=>p["boost_"+x]?<b style={{fontSize:18}}>Play {naira(x)} Win {naira(p["boost_"+x])}</b>:null;
  return <div className="ad">N100 fit change your day.{L(100)}{L(1000)}Small Numbers 1–20. Win Everyday. 5 Games Everyday.<div className="t">Big win amounts are for 5 Direct.</div></div>}
const byNew=(a,b)=>(b.createdAt?b.createdAt.seconds:9e9)-(a.createdAt?a.createdAt.seconds:9e9);
const validTimes=t=>(t||[]).map(x=>String(x).trim()).filter(x=>/^([01]?\d|2[0-3]):[0-5]\d$/.test(x));
const lab=h=>h<12?"Morning":h<16?"Afternoon":h<20?"Evening":"Night";
const NAMES=["O2LIVE Morning Rise","O2LIVE Midday Cash","O2LIVE Afternoon Rush","O2LIVE Evening Gold","O2LIVE Night Jackpot"];
function slots(ts,now,days){const o=[],mm=t=>{const[h,m]=t.split(":").map(Number);return h*60+m},sorted=[...ts].sort((a,b)=>mm(a)-mm(b));
  days.forEach(k=>sorted.forEach((t,i)=>{const[h,m]=t.split(":").map(Number),x=new Date(now);x.setDate(x.getDate()+k);x.setHours(h,m,0,0);o.push({at:x.getTime(),label:sorted.length===5?NAMES[i]:"O2LIVE "+lab(h),time:t})}));return o.sort((a,b)=>a.at-b.at)}
function useNext(){
  const[s,setS]=useState(null),[now,setNow]=useState(Date.now());
  useEffect(()=>db.doc("appSettings/draws").onSnapshot(d=>setS(d.data()||null),()=>{}),[]);
  useEffect(()=>{const i=setInterval(()=>setNow(Date.now()),30000);return()=>clearInterval(i)},[]);
  const ts=validTimes(s&&s.times);
  if(!s||!ts.length||s.paused)return{text:s&&s.paused?"Draws paused":"Draw times not set",open:false};
  const L=slots(ts,now,[0,1]).filter(x=>x.at>now),b=L[0],mins=Math.max(1,Math.round((b.at-now)/60000));
  return{text:"Next Draw: "+b.label+" in "+(mins>=60?Math.floor(mins/60)+"h "+mins%60+"m":mins+" mins"),open:s.entriesOpen!==false,at:b.at,label:b.label,time:b.time,list:L.slice(0,5)};
}

function Auth(){
  const[mode,setMode]=useState("reg"),[phone,setPhone]=useState(""),[name,setName]=useState(""),[pin,setPin]=useState(""),[e,setE]=useState(""),[b,setB]=useState(false);
  const go=async()=>{setE("");setB(true);try{
    mode==="reg"?await register(phone,name.trim(),pin):await login(phone,pin);
  }catch(x){setE(nice(x))}setB(false)};
  const[ae,setAe]=useState(""),[ap,setAp]=useState("");
  if(mode==="admin")return <div className="w"><h1>O2LIV</h1><div className="slog">ADMIN</div>
    <input placeholder="Admin email" type="email" value={ae} onChange={x=>setAe(x.target.value)}/>

    {e&&<div className="err">{e}</div>}
    <button className="btn gold" disabled={!ae||!ap} onClick={()=>{setE("");auth.signInWithEmailAndPassword(ae.trim(),ap).catch(x=>setE("Wrong email or password"))}}>LOGIN</button>
    <button className="back" onClick={()=>setMode("login")}>← Player login</button></div>;
  return <div className="w"><h1>O2LIV</h1><div className="slog">WIN BIG</div>
    <Ad/>
    <input placeholder="Phone number" inputMode="tel" value={phone} onChange={x=>setPhone(x.target.value)}/>
    {mode==="reg"&&<input placeholder="Your name" value={name} onChange={x=>setName(x.target.value)}/>}
    <input placeholder="4-digit PIN" type="password" inputMode="numeric" maxLength={4} value={pin} onChange={x=>setPin(x.target.value.replace(/\D/g,""))}/>
    {e&&<div className="err">{e}</div>}
    <button className="btn mint" disabled={b||pin.length!==4||phone.length<10||(mode==="reg"&&!name)} onClick={go}>{mode==="reg"?"START":"LOGIN"}</button>
    <button className="back" onClick={()=>setMode(mode==="reg"?"login":"reg")}>{mode==="reg"?"I get account already – Login":"New here? Register"}</button>
    <br/><button className="back t" onClick={()=>{setE("");setMode("admin")}}>Admin login</button></div>;
}

function useMine(){const[a,setA]=useState([]);useEffect(()=>db.collection("gameEntries").where("uid","==",auth.currentUser.uid).limit(40).onSnapshot(s=>setA(s.docs.map(d=>d.data()).sort(byNew)),()=>{}),[]);return a}
function Home({go,user,nx}){
  const[w,setW]=useState([]),mine=useMine(),last=mine.find(e=>e.status!=="pending"),wait=mine.filter(e=>e.status==="pending").length;
  useEffect(()=>db.collection("winners").where("verified","==",true).limit(30).onSnapshot(s=>setW(s.docs.map(d=>d.data()).sort(byNew).slice(0,5)),()=>{}),[]);
  return <div className="w"><h1>O2LIV</h1><div className="slog">WIN BIG</div>
    <Ad/>
    <button className="btn mint" onClick={()=>go("play")}>PLAY NOW</button>
    <button className="btn gold" onClick={()=>go("fund")}>ADD MONEY</button>
    <button className="btn white" onClick={()=>go("wallet")}>MY WALLET</button>
    <button className="btn lb" onClick={()=>go("chat")}>O2LIVE CHAT</button>
    <div className="card"><b>⏰ {nx.text}</b></div>
    {wait>0&&<div className="card">⏳ {wait} game(s) waiting for the draw</div>}
    {last&&<div className="card" style={{borderLeft:"8px solid "+(last.status==="lost"?"#ff4d5e":"#2ee6a6")}}><b>{last.status==="won"?"🎉 YOU WIN "+naira(last.winAmount)+"!":last.status==="nearmiss"?"🔥 Near miss! Bonus "+naira(last.winAmount)+" added":"😔 You no win this time"}</b><div className="t" style={{color:"#334"}}>{last.drawLabel} draw · you picked {(last.numbers||[]).join(", ")} · drawn: {(last.drawn||[]).join(", ")}</div></div>}
    <div className="mini"><div><b>NO LONG STORY</b><br/>Pick numbers, press PLAY, wait for draw.</div>
    <div><b>WIN EVERYDAY</b><br/>5 draws everyday: Morning, Midday, Afternoon, Evening, Night.</div>
    <div><b>MONEY DEY COME BACK</b><br/>Lose big? We give you cashback. Lose small? We give you Free Ticket.</div></div>
    <h2>Last verified winners</h2>
    {w.length?w.map((x,i)=><div className="card" key={i}>🏆 {x.name} won {naira(x.amount)} with {naira(x.stake)}{x.drawLabel?" in "+x.drawLabel.replace("O2LIVE ",""):""}</div>):<div className="t">No verified winners yet.</div>}
    <button className="back" onClick={()=>auth.signOut()}>Logout ({user.name})</button></div>;
}

function Play({back,nx}){
  const pay=usePay(),L=nx.list||[];
  const[type,setType]=useState(5),[sel,setSel]=useState([]),[stake,setStake]=useState(null),[pk,setPk]=useState(null),[m,setM]=useState(""),[b,setB]=useState(false);
  const cur=L.find(x=>x.at===pk)||L[0];
  const tog=n=>setSel(s=>s.includes(n)?s.filter(x=>x!==n):s.length<type?[...s,n]:s);
  const pz=stake&&(type===5&&pay["boost_"+stake]?pay["boost_"+stake]:pay[type+"_"+stake]);
  const ok=sel.length===type&&stake&&nx.open&&cur;
  const submit=async()=>{setB(true);setM("");try{await placeEntry(type,sel,stake,cur);setM("You don play! Good Luck! 🍀 "+cur.label+" ("+cur.time+")");setSel([]);setStake(null)}catch(x){setM(nice(x))}setB(false)};
  return <div className="w"><button className="back" onClick={back}>← Back</button><h2>Pick your game</h2>
    <div className="row" style={{flexWrap:"wrap"}}>{L.map(x=><button key={x.at} className="sbtn" style={{background:cur&&cur.at===x.at?"#ffc83d":"#fff",color:"#0b1f4d",margin:2}} onClick={()=>setPk(x.at)}>{x.label.replace("O2LIVE ","")}<br/><span style={{fontSize:11}}>{new Date(x.at).toLocaleDateString([],{weekday:"short"})} {x.time}</span></button>)}</div>
    <h2>Pick your numbers</h2>
    <div className="row">{[2,3,4,5].map(t=><button key={t} className={"btn "+(type===t?"mint":"white")} style={{fontSize:14,padding:12}} onClick={()=>{setType(t);setSel([])}}>{t} DIRECT</button>)}</div>
    <div className="balls">{Array.from({length:20},(_,i)=>i+1).map(n=><button key={n} className={"ball"+(sel.includes(n)?" on":"")} onClick={()=>tog(n)}>{n}</button>)}</div>
    <p>Selected ({sel.length}/{type}): <b>{[...sel].sort((a,b)=>a-b).join(", ")||"none"}</b></p>
    <div className="row" style={{flexWrap:"wrap"}}>{STAKES.map(([s,c])=><button key={s} className="btn" style={{background:c,width:"48%",color:"#fff",outline:stake===s?"4px solid #fff":"none"}} onClick={()=>setStake(s)}>{naira(s)}</button>)}</div>
    {pz>0&&<div className="card"><b>Win {naira(pz)}</b> if your {type} numbers are all inside the 5 winning numbers</div>}
    {!nx.open&&<div className="err">Entries are closed right now.</div>}
    <button className="btn mint" disabled={!ok||b} onClick={submit}>PLAY</button>
    {m&&<div className="card"><b>{m}</b></div>}</div>;
}

function Fund({back}){
  const[bank,setBank]=useState(null),[f,setF]=useState({amount:"",senderName:"",reference:"",note:""}),[m,setM]=useState(""),[h,setH]=useState([]);
  useEffect(()=>db.doc("appSettings/bank").onSnapshot(d=>setBank(d.data()),()=>{}),[]);
  useEffect(()=>db.collection("fundingRequests").where("uid","==",auth.currentUser.uid).limit(30).onSnapshot(s=>setH(s.docs.map(d=>d.data()).sort(byNew)),()=>{}),[]);
  const set=k=>x=>setF({...f,[k]:x.target.value});
  const submit=async()=>{setM("");try{await submitFunding({...f,amount:+f.amount});setM("Request sent. Status: PENDING");setF({amount:"",senderName:"",reference:"",note:""})}catch(x){setM(nice(x))}};
  return <div className="w"><button className="back" onClick={back}>← Back</button><h2>Add Money</h2>
    <div className="card">{bank?<>Bank: <b>{bank.bankName}</b><br/>Account name: <b>{bank.accountName}</b><br/>Account number: <b>{bank.accountNumber}</b></>:"Bank details not set yet."}</div>
    <p className="t">Transfer with your bank app, then fill this form. Wallet is credited only after admin confirms the transfer.</p>
    <input placeholder="Amount (₦)" inputMode="numeric" value={f.amount} onChange={set("amount")}/>
    <input placeholder="Sender account name" value={f.senderName} onChange={set("senderName")}/>
    <input placeholder="Transfer reference / transaction ID" value={f.reference} onChange={set("reference")}/>
    <input placeholder="Description (optional)" value={f.note} onChange={set("note")}/>
    <button className="btn gold" disabled={!f.amount||!f.senderName||!f.reference} onClick={submit}>I DON PAY</button>
    {m&&<div className="card">{m}</div>}
    <h2>History</h2>{h.map((x,i)=><div className="card" key={i}>{naira(x.amount)} · {x.reference} · <b>{(x.status||"pending").toUpperCase()}</b></div>)}</div>;
}

function Wallet({back,user}){
  const mine=useMine();
  const[bk,setBk]=useState({}),[w,setW]=useState({amount:"",bankName:"",accountName:"",accountNumber:""}),[m,setM]=useState(""),[tx,setTx]=useState([]);
  useEffect(()=>db.collection("walletTransactions").where("uid","==",auth.currentUser.uid).limit(30).onSnapshot(s=>setTx(s.docs.map(d=>d.data()).sort(byNew)),()=>{}),[]);
  const set=k=>x=>setW({...w,[k]:x.target.value});
  const submit=async()=>{setM("");try{await requestWithdrawal({...w,amount:+w.amount});setM("Withdrawal request sent.")}catch(x){setM(nice(x))}};
  const C=({t,v})=><div className="card"><div className="t">{t}</div><b style={{fontSize:22}}>{v}</b></div>;
  return <div className="w"><button className="back" onClick={back}>← Back</button><h2>My Wallet</h2>
    <C t="Available balance" v={naira(user.balance)}/><C t="Cashback balance" v={naira(user.cashback)}/><C t="Free tickets" v={user.freeTickets||0}/>
    <C t="Total deposits" v={naira(user.totalDeposits)}/><C t="Total winnings" v={naira(user.totalWinnings)}/>
    <h2>Withdraw</h2>
    <input placeholder="Amount (₦)" inputMode="numeric" value={w.amount} onChange={set("amount")}/><input placeholder="Bank name" value={w.bankName} onChange={set("bankName")}/>
    <input placeholder="Account name" value={w.accountName} onChange={set("accountName")}/><input placeholder="Account number" inputMode="numeric" maxLength={10} value={w.accountNumber} onChange={set("accountNumber")}/>
    <button className="btn mint" disabled={!w.amount||!w.bankName||!w.accountName||w.accountNumber.length!==10} onClick={submit}>REQUEST WITHDRAWAL</button>{m&&<div className="card">{m}</div>}
    <h2>Game history</h2>{mine.map((e,i)=><div className="card" key={"g"+i}><div className="top"><b>{e.type} DIRECT · {naira(e.stake)}</b><span className={"chip "+e.status}>{String(e.status).toUpperCase()}</span></div>Picked: {(e.numbers||[]).join(", ")}<div className="t" style={{color:"#334"}}>{e.drawLabel||""}{e.drawn?" · Drawn: "+e.drawn.join(", "):""}{e.status==="won"||e.status==="nearmiss"?" · "+(e.status==="won"?"Won ":"Near-miss bonus ")+naira(e.winAmount):""}</div></div>)}
    <h2>Transactions</h2>{tx.map((x,i)=><div className="card" key={i}>{x.type}: <b>{naira(x.amount)}</b></div>)}</div>;
}

function Chat({back}){
  const uid=auth.currentUser.uid,[bc,setBc]=useState([]),[sup,setSup]=useState([]),[t,setT]=useState("");
  useEffect(()=>db.collection("broadcasts").orderBy("createdAt","desc").limit(10).onSnapshot(s=>setBc(s.docs.map(d=>d.data())),()=>{}),[]);

  const FAQ={"how do i play":"Press PLAY NOW, pick 2 or 5 numbers, choose stake, press PLAY.","how do i fund my wallet":"Press ADD MONEY, transfer to our bank account, then submit the reference. Admin confirms.","how do i withdraw":"Open MY WALLET and submit a withdrawal request."};
  const ans=FAQ[t.toLowerCase().replace(/[?]/g,"").trim()];
  return <div className="w"><button className="back" onClick={back}>← Back</button><h2>O2LIVE Chat</h2>
    {bc.map((x,i)=><div className="msg" key={"b"+i}>📢 {x.text}</div>)}
    {sup.map((x,i)=><div className={"msg "+(x.from==="player"?"me":"")} key={i}>{x.text}</div>)}
    <div className="t">Quick: {Object.keys(FAQ).map(q=><span key={q} onClick={()=>setT(q)} style={{textDecoration:"underline",marginRight:8}}>{q}</span>)}</div>
    {ans&&<div className="msg">🤖 {ans}</div>}
    <input placeholder="Type message to support..." value={t} onChange={x=>setT(x.target.value)}/>
