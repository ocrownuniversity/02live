function useNext(){

    {tab==="withdrawals"&&wd.map(w=><L key={w.id} a={<>{naira(w.amount)} · {w.bankName} · {w.accountName} · {w.accountNumber}<br/><b>{w.status}</b></>} b={w.status==="pending"&&<><B c="mint" f={()=>wdPaid(w)} t="Mark paid"/><B c="lb" f={()=>wdNo(w)} t="Reject+refund"/></>}/>)}
    {tab==="entries"&&ent.map(e=><L key={e.id} a={<>{e.type} DIRECT · {(e.numbers||[]).join(",")} · {naira(e.stake)}<br/><b>{e.status}</b> {e.winAmount?naira(e.winAmount):""}</>} b={e.status==="pending"&&<><B c="mint" f={()=>win(e)} t="Won"/><B c="lb" f={()=>lose(e)} t="Lost"/></>}/>)}
    {tab==="players"&&ply.filter(p=>((p.name||"")+p.phone).toLowerCase().includes(ql)).map(p=><L key={p.id} a={<>{p.name} · {p.phone} · {naira(p.balance)} · <b>{p.status}</b></>} b={<B c="white" f={()=>tt(()=>db.doc("o2users/"+p.id).update({status:p.status==="active"?"suspended":"active"}))} t={p.status==="active"?"Suspend":"Reactivate"}/>}/>)}
    {tab==="settings"&&<><h3>Bank details</h3>{["bankName","accountName","accountNumber"].map(k=><input key={k} placeholder={k} value={bank[k]} onChange={x=>setBank({...bank,[k]:x.target.value})}/>)}
      <B c="mint" f={()=>tt(()=>db.doc("appSettings/bank").set(bank))} t="Save bank"/>
      <h3>Draw times (24h, comma separated)</h3><input value={times} onChange={x=>setTimes(x.target.value)}/>
      <B c="mint" f={()=>tt(()=>db.doc("appSettings/draws").set({times:times.split(",").map(x=>x.trim())},{merge:true}))} t="Save times"/>
      <div className="row"><B c="gold" f={()=>tt(()=>db.doc("appSettings/draws").set({paused:true},{merge:true}))} t="Pause draws"/><B c="mint" f={()=>tt(()=>db.doc("appSettings/draws").set({paused:false},{merge:true}))} t="Resume"/></div>
      <div className="row"><B c="lb" f={()=>tt(()=>db.doc("appSettings/draws").set({entriesOpen:false},{merge:true}))} t="Close entries"/><B c="mint" f={()=>tt(()=>db.doc("appSettings/draws").set({entriesOpen:true},{merge:true}))} t="Open entries"/></div></>}
    {tab==="broadcast"&&<><input placeholder="Message to all players (also use for draw numbers)" value={bt} onChange={x=>setBt(x.target.value)}/><B c="mint" f={()=>tt(async()=>{await db.collection("broadcasts").add({text:bt,createdAt:TS});setBt("")})} t="Send to all"/></>}
    {tab==="support"&&(conv?<><button className="back" onClick={()=>setConv(null)}>← Chats</button>{msgs.map((x,i)=><div className={"msg "+(x.from==="admin"?"me":"")} key={i}>{x.text}</div>)}<input value={rep} onChange={x=>setRep(x.target.value)} placeholder="Reply..."/><B c="mint" f={reply} t="Send"/></>:convs.map(c=><div className="card" key={c.id} onClick={()=>pick(c)}>{c.phone}: {c.last}</div>))}
    <button className="back" onClick={()=>auth.signOut()}>Logout</button></div>;
}

function App(){
  const[u,setU]=useState(undefined),[doc,setDoc]=useState({}),[v,setV]=useState("home"),nx=useNext();
  useEffect(()=>auth.onAuthStateChanged(x=>setU(x)),[]);
  useEffect(()=>u?db.doc("o2users/"+u.uid).onSnapshot(d=>setDoc(d.data()||{}),()=>{}):undefined,[u]);
  if(u===undefined)return <div className="w">Loading…</div>;
  if(!u)return <Auth/>;
  if(u.email===ADMIN)return <Admin/>;
  const back=()=>setV("home");
  return <>
    {v==="home"&&<Home go={setV} user={doc} nx={nx}/>}
    {v==="play"&&<Play back={back} nx={nx}/>}
    {v==="fund"&&<Fund back={back}/>}
    {v==="wallet"&&<Wallet back={back} user={doc}/>}
    {v==="chat"&&<Chat back={back}/>}
    {v!=="chat"&&<button className="chatfab" onClick={()=>setV("chat")}>💬 O2LIVE Chat</button>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
