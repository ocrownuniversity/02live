      <div className="top"><b>{p.name}</b><Chip s={p.status}/></div>📞 {p.phone}<div className="stats" style={{margin:"8px 0"}}><div>Balance<b className="big" style={{display:"block"}}>{naira(p.balance)}</b></div><div>Won<b className="big" style={{display:"block"}}>{naira(p.totalWinnings)}</b></div></div>
      <Sb c="" f={()=>run(()=>db.doc("o2users/"+p.id).update({status:p.status==="active"?"suspended":"active"}),p.status==="active"?"Account suspended":"Account reactivated")} t={p.status==="active"?"Suspend account":"Reactivate account"}/> <Sb c="" f={()=>setPb(pb===p.id?null:p.id)} t={pb===p.id?"Hide bets":"View bets"}/>
      {pb===p.id&&<div style={{marginTop:8}}>{ent.filter(e=>e.uid===p.id).map((e,i)=><div className="t" key={i} style={{color:"#334"}}>{(e.drawLabel||"").replace("O2LIVE ","")} · {gname(e)} {naira(tot(e))} · {(e.numbers||[]).join(",")} · <b>{e.status}</b>{e.winAmount>0?" "+naira(e.winAmount):""}</div>)}{!ent.some(e=>e.uid===p.id)&&<div className="t">No bets yet.</div>}</div>}</div>)}</>}
    {tab==="set"&&<>
      <div className="card"><b>Bank details (shown to players)</b>
        <Lbl t="Bank name"/><input value={bank.bankName} onChange={x=>setBank({...bank,bankName:x.target.value})}/>
        <Lbl t="Account name"/><input value={bank.accountName} onChange={x=>setBank({...bank,accountName:x.target.value})}/>
        <Lbl t="Account number"/><input inputMode="numeric" value={bank.accountNumber} onChange={x=>setBank({...bank,accountNumber:x.target.value})}/>
        <div className="acts"><Sb c="g" f={()=>run(()=>db.doc("appSettings/bank").set({bankName:bank.bankName,accountName:bank.accountName,accountNumber:bank.accountNumber}),"Bank details saved")} t="Save bank details"/></div></div>
      <div className="card"><b>Draw times</b><div className="t" style={{color:"#334"}}>24-hour format, e.g. 09:00, 12:00, 15:00, 18:00, 21:00 (not winning numbers)</div>
        <input value={times} onChange={x=>setTimes(x.target.value)}/>
        <div className="acts"><Sb c="g" f={()=>{const t=times.split(",").map(x=>x.trim()).filter(Boolean);if(validTimes(t).length!==t.length||!t.length)return setM("⚠ Use HH:MM times like 18:00");run(()=>db.doc("appSettings/draws").set({times:t},{merge:true}),"Draw times saved")}} t="Save times"/></div>
        <div className="top" style={{marginTop:10}}><span>Draws: <b>{S.draws.paused?"PAUSED":"running"}</b></span><Sb c="y" f={()=>run(()=>db.doc("appSettings/draws").set({paused:!S.draws.paused},{merge:true}),S.draws.paused?"Draws resumed":"Draws paused")} t={S.draws.paused?"Resume":"Pause"}/></div>
        <div className="top" style={{marginTop:10}}><span>Entries: <b>{S.draws.entriesOpen===false?"CLOSED":"open"}</b></span><Sb c="y" f={()=>run(()=>db.doc("appSettings/draws").set({entriesOpen:S.draws.entriesOpen===false},{merge:true}),S.draws.entriesOpen===false?"Entries are now OPEN":"Entries are now CLOSED")} t={S.draws.entriesOpen===false?"Open entries":"Close entries"}/></div></div>
      <div className="card"><b>⏱ Automatic results</b><div className="t" style={{color:"#334"}}>Each draw gets its 5 random numbers and is settled this many minutes after the draw time (9:00 draw → results at 10:00 with 60). It runs while this admin page is open; if the page was closed, it catches up as soon as you open it again.</div>
        <div className="top" style={{marginTop:8}}><span>Auto results: <b>{S.draws.autoSettle?"ON":"OFF"}</b></span><Sb c="y" f={()=>run(()=>db.doc("appSettings/draws").set(S.draws.autoSettle?{autoSettle:false}:{autoSettle:true,autoFrom:Date.now()},{merge:true}),S.draws.autoSettle?"Auto results OFF":"Auto results ON")} t={S.draws.autoSettle?"Turn off":"Turn on"}/></div>
        <Lbl t="Minutes after the draw time"/><input inputMode="numeric" value={dm} onChange={x=>setDm(x.target.value.replace(/\D/g,""))}/>
        <div className="acts"><Sb c="g" d={!dm} f={()=>run(()=>db.doc("appSettings/draws").set({delayMin:+dm},{merge:true}),"Minutes saved")} t="Save minutes"/></div></div>
      {(()=>{const K=5,C=(n,k)=>{let v=1;for(let i=0;i<k;i++)v=v*(n-i)/(i+1);return v},ok=true;return <div className="card"><b>Odds and payout % per game</b>
        <div className="t" style={{color:"#334"}}>Winners always come from the real drawn numbers; nobody's chances are changed. This shows the true odds and sets prizes to give the return % you choose.</div>
        {ok&&[2,3,4,5].map(t=>{const P=C(K,t)/C(20,t);return <div key={t}><b className="lbl">{t} DIRECT · chance to win {(P*100).toFixed(2)}% (1 in {Math.round(1/P).toLocaleString()})</b>
          <Lbl t="Return to players % (70 = on average ₦70 paid back per ₦100 staked)"/><input inputMode="numeric" value={tg[t]} onChange={x=>setTg({...tg,[t]:+x.target.value.replace(/\D/g,"")})}/>
          {[100,200,500,1000].map(s=><div className="t" key={s} style={{color:"#334"}}>₦{s} prize now: {pv(t,s)?naira(pv(t,s))+" → returns "+(pv(t,s)*P/s*100).toFixed(1)+"% (before near-miss)":"not set"}</div>)}
          <div className="acts"><Sb c="y" f={()=>setPay(p=>{const n={...p};[100,200,500,1000].forEach(s=>n[t+"_"+s]=Math.max(10,Math.round(s*tg[t]/100/P/10)*10));return n})} t={"Fill "+t+" DIRECT prizes for "+tg[t]+"%"}/></div></div>})}
        <div className="t" style={{color:"#334"}}>After filling, press "Save prize table" below.</div></div>})()}
      <div className="card"><b>Prize table (₦ paid to a winner)</b><div className="t" style={{color:"#334"}}>Prize = stake × multiplier (or type any amount). Press Save to apply. The adverts and the play screen update automatically from this table.</div>
        {[2,3,4,5].map(t=><div key={t}><b className="lbl">{t} DIRECT</b><div className="top"><span>Prize = stake ×</span><input style={{width:90,margin:0}} inputMode="numeric" value={mu[t]} onChange={x=>setMu({...mu,[t]:+x.target.value.replace(/\D/g,"")})}/><Sb c="y" f={()=>setPay(p=>{const n={...p};[100,200,500,1000].forEach(s=>n[t+"_"+s]=s*mu[t]);return n})} t="Apply"/></div><div className="grid2">{[100,200,500,1000].map(s=><div key={s}><Lbl t={"Stake ₦"+s}/><input inputMode="numeric" value={pay[t+"_"+s]||""} onChange={x=>setPay({...pay,[t+"_"+s]:+x.target.value.replace(/\D/g,"")||0})}/></div>)}</div></div>)}
        <div><b className="lbl">5 DIRECT BOOSTER – paid instead of the normal 5 Direct prize (leave 0 to use normal)</b><div className="grid2">{[100,200,500,1000].map(s=><div key={s}><Lbl t={"Stake ₦"+s}/><input inputMode="numeric" value={pay["boost_"+s]||""} onChange={x=>setPay({...pay,["boost_"+s]:+x.target.value.replace(/\D/g,"")||0})}/></div>)}</div></div>
        <div className="acts"><Sb c="g" f={()=>run(()=>db.doc("appSettings/payouts").set(pay),"Prize table saved")} t="Save prize table"/></div></div></>}
    {tab==="bc"&&<div className="card"><b>Message to all players</b><input placeholder="e.g. Next draw in 10 minutes. Play now!" value={bt} onChange={x=>setBt(x.target.value)}/><div className="acts"><Sb c="g" d={!bt||busy} f={()=>run(async()=>{await db.collection("broadcasts").add({text:bt,createdAt:TS});setBt("")},"Message sent to all players")} t="Send to all"/></div></div>}
    {tab==="sup"&&(conv?<><Sb c="" f={()=>setConv(null)} t="← All chats"/><div style={{marginTop:8}}>{msgs.map((x,i)=><div className={"msg "+(x.from==="admin"?"me":"")} key={i}>{x.text}</div>)}</div><input value={rep} onChange={x=>setRep(x.target.value)} placeholder="Reply..."/><Sb c="g" d={!rep} f={reply} t="Send reply"/></>:<>{!convs.length&&<div className="card">No messages yet.</div>}{convs.map(c=><div className="card" key={c.id} onClick={()=>pick(c)}><b>📞 {c.phone}</b><br/>{c.last}</div>)}</>)}
  </div>;
}

function Bets({back}){const mine=useMine(),dly=useDelay(),[f,setF]=useState("all");
  const list=mine.filter(e=>f==="all"||(f==="won"?e.status==="won"||e.status==="nearmiss":e.status===f));
  return <div className="w"><button className="back" onClick={back}>← Back</button><h2>My Bet History</h2>
    <div className="acts">{["all","pending","won","lost"].map(x=><Sb key={x} c={f===x?"y":""} f={()=>setF(x)} t={x.toUpperCase()}/>)}</div>
    {!list.length&&<p className="t">No bets here yet.</p>}
    {list.map((e,i)=><div className="card" key={i}><div className="top"><b>{(e.drawLabel||"").replace("O2LIVE ","")}</b><SChip e={e}/></div>
      {gname(e)} · {naira(tot(e))} · {when(e.createdAt)}<br/>Your numbers: {(e.numbers||[]).map(x=><span key={x} className="nb" style={{background:e.drawn&&e.drawn.includes(x)?"#2ee6a6":"#ddd"}}>{x}</span>)}
      {e.drawn&&<div>Draw: <Nums n={e.drawn}/></div>}{e.winLines>0&&e.numbers.length>e.type&&<div className="t" style={{color:"#334"}}>{e.winLines} of {e.lines} lines won</div>}{e.status==="pending"&&<div className="t" style={{color:"#334"}}>{Date.now()>(e.drawAt||0)+dly*60000?"⏳ Results are being processed – check again shortly":"⏳ Results about "+new Date((e.drawAt||0)+dly*60000).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}</div>}<Money e={e}/></div>)}</div>;
}
function App(){
  const[u,setU]=useState(undefined),[doc,setDoc]=useState({}),[v,setV]=useState("home"),nx=useNext();
  useEffect(()=>auth.onAuthStateChanged(x=>setU(x)),[]);
  useEffect(()=>u?db.doc("o2users/"+u.uid).onSnapshot(d=>setDoc(d.data()||{}),()=>{}):undefined,[u]);
  if(u===undefined)return <div className="splash"><div className="logo"></div><h1>O2LIVE</h1><div className="slog">WIN BIG</div><div className="dots"><i></i><i></i><i></i><i></i><i></i></div><p>Loading…</p></div>;
  if(!u)return <Auth/>;
  if(u.email===ADMIN)return <Admin/>;
  const back=()=>setV("home");
  return <>
    {v==="home"&&<Home go={setV} user={doc} nx={nx}/>}
    {v==="play"&&<Play back={back} nx={nx} go={setV} user={doc}/>}
    {v==="notifs"&&<Notifs back={back}/>}
    {v==="safe"&&<Safe back={back}/>}
    {v==="fund"&&<Fund back={back}/>}
    {v==="bets"&&<Bets back={back}/>}
    {v==="wallet"&&<Wallet back={back} user={doc}/>}
    {v==="chat"&&<Chat back={back}/>}
    {v!=="chat"&&<button className="chatfab" onClick={()=>setV("chat")}>💬 O2LIVE Chat</button>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<><App/><Toaster/></>);
</script></body></html>
